<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#065F46" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" filter="url(#shadow)"/>

  <!-- Calendar Base -->
  <rect x="106" y="136" width="300" height="260" rx="36" fill="#FFFFFF"/>

  <!-- Calendar Top Red/Emerald Bar -->
  <path d="M 106 172 C 106 152 122 136 142 136 L 370 136 C 390 136 406 152 406 172 L 406 210 L 106 210 Z" fill="#10B981"/>

  <!-- Calendar Rings -->
  <circle cx="180" cy="136" r="14" fill="#047857"/>
  <circle cx="332" cy="136" r="14" fill="#047857"/>

  <!-- Tree Logo Symbol inside calendar -->
  <g fill="#10B981" transform="translate(256, 305)">
    <!-- Tree Trunk -->
    <rect x="-10" y="25" width="20" height="40" rx="6" fill="#059669"/>
    <!-- Tree Foliage Circles (TimeTree Style) -->
    <circle cx="0" cy="-20" r="38" fill="#10B981"/>
    <circle cx="-32" cy="10" r="30" fill="#34D399"/>
    <circle cx="32" cy="10" r="30" fill="#059669"/>
    <circle cx="0" cy="12" r="32" fill="#10B981"/>
  </g>
</svg>
